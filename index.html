<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RibCage 器官图鉴</title>
<meta name="description" content="No Flesh Within Chest 2 · 器官图鉴与构筑器">
<link rel="preload" as="image" href="./mc/gui/kubejs_player_17.png?v=21">
<link rel="stylesheet" href="./style.css?v=21">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text"><b>RibCage 器官图鉴</b><span>No Flesh Within Chest 2</span></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="codex" aria-selected="true">图鉴</button>
    <button class="tab" role="tab" data-view="builder" aria-selected="false">构筑</button>
    <button class="tab" role="tab" data-view="bonds" aria-selected="false">羁绊</button>
  </nav>
</header>

<main class="wrap">
  <section class="view active" id="view-codex">
    <div class="codex">
      <aside class="filters" id="filters">
        <div class="filter-head">
          <h2>筛选</h2>
          <button class="linkbtn" id="resetFilters">重置</button>
        </div>
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input type="search" id="q" placeholder="名称 / ID / 效果" autocomplete="off">
        </label>
        <div class="filter-group">
          <h3>分类</h3>
          <div class="chips" id="groups"></div>
        </div>
        <div class="filter-group">
          <h3>稀有度</h3>
          <div class="chips" id="ranks"></div>
        </div>
        <div class="filter-group">
          <h3>触发事件</h3>
          <select id="eventFilter"><option value="">全部事件</option></select>
        </div>
        <div class="filter-group">
          <h3>属性</h3>
          <select id="scoreFilter"><option value="">全部属性</option></select>
        </div>
        <p class="filters-note">数据由整合包脚本与语言文件生成。</p>
      </aside>

      <div class="results">
        <div class="resultbar">
          <div class="result-count"><strong id="count">—</strong><span class="muted">个器官</span></div>
          <button class="btn ghost only-narrow" id="toggleFilters">筛选</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <aside class="detail" id="detail" aria-live="polite">
        <div class="detail-empty" id="detailEmpty">
          <span class="empty-mark" aria-hidden="true"></span>
          <p>点选一个器官<br>查看属性、特殊效果与获取方式</p>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </div>
  </section>

  <section class="view" id="view-builder">
    <div class="builder">
      <div class="panel builder-main">
        <div class="builder-head">
          <label class="field">
            <span>胸腔槽位布局</span>
            <select id="cavitySelect"></select>
          </label>
          <div class="row">
            <button class="btn" id="fillDefault">填入默认器官</button>
            <button class="btn ghost" id="clearBuild">清空</button>
          </div>
        </div>
        <div class="cavity"><div class="slotgrid" id="slotgrid"></div></div>
        <p class="hint" id="cavityHint"></p>
      </div>
      <aside class="builder-side">
        <div class="panel">
          <h3>属性合计</h3>
          <div class="totals" id="totals"><span class="hint">尚未放入器官</span></div>
        </div>
        <div class="panel">
          <h3>特殊效果</h3>
          <div class="fx" id="special"><span class="hint">尚未放入器官</span></div>
        </div>
        <div class="panel">
          <h3>羁绊效果</h3>
          <div class="fx" id="bondfx"><span class="hint">尚未触发羁绊</span></div>
        </div>
        <div class="panel">
          <h3>分享码</h3>
          <div class="row" style="margin-bottom:8px">
            <button class="btn primary" id="exportBtn">导出</button>
            <button class="btn" id="importBtn">导入</button>
          </div>
          <textarea id="share" rows="3" placeholder="分享码会显示在这里，或粘贴分享码后点导入"></textarea>
        </div>
      </aside>
    </div>
  </section>

  <section class="view" id="view-bonds">
    <div class="section-head">
      <h2>器官羁绊</h2>
      <p class="muted" id="bondCount">—</p>
    </div>
    <div class="bonds" id="bonds"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<div class="picker" id="picker"><div class="box">
  <div class="row" style="justify-content:space-between">
    <input type="search" id="pickQ" placeholder="搜索器官…">
    <button class="btn ghost" id="pickClear">移除</button>
  </div>
  <div class="list" id="pickList"></div>
</div></div>

<script src="./app.js?v=21"></script>
</body>
</html>
