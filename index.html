<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RibCage 器官图鉴</title>
<link rel="preload" as="image" href="./mc/gui/kubejs_player_17.png?v=16">
<link rel="stylesheet" href="./style.css?v=16">
</head>
<body>
<header class="top">
  <div class="brand"><b>RibCage 器官图鉴</b><span>No Flesh Within Chest 2</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="codex" aria-selected="true">图鉴</button>
    <button class="tab" role="tab" data-view="builder" aria-selected="false">构筑</button>
    <button class="tab" role="tab" data-view="bonds" aria-selected="false">羁绊</button>
  </nav>
</header>

<main class="wrap">
  <!-- 图鉴 -->
  <section class="view active" id="view-codex">
    <div class="split">
      <aside class="panel">
        <h3>筛选</h3>
        <label class="field"><span>搜索</span>
          <input type="search" id="q" placeholder="名称 / id / 效果文本">
        </label>
        <div class="field"><span>分类</span><div class="chips" id="groups"></div></div>
        <div class="field"><span>触发事件</span>
          <select id="eventFilter"><option value="">全部</option></select>
        </div>
        <div class="field"><span>稀有度</span><div class="chips" id="ranks"></div></div>
        <div class="field"><span>属性</span>
          <select id="scoreFilter"><option value="">全部</option></select>
        </div>
        <div class="hint">数据由整合包脚本与语言文件生成，tooltip 为静态文本还原。</div>
      </aside>
      <div>
        <div class="resultbar"><span id="count">—</span><span>·</span><span class="muted">滚轮翻页，点击查看 tooltip</span></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </section>

  <!-- 构筑 -->
  <section class="view" id="view-builder">
    <div class="builder">
      <div class="panel">
        <div class="row" style="justify-content:space-between;align-items:end;margin-bottom:12px">
          <label class="field" style="margin:0;flex:1 1 260px"><span>胸腔槽位布局（cc_inventory_type）</span>
            <select id="cavitySelect"></select>
          </label>
          <div class="row">
            <button class="btn" id="fillDefault">填入默认器官</button>
            <button class="btn" id="clearBuild">清空</button>
          </div>
        </div>
        <div class="cavity"><div class="slotgrid" id="slotgrid"></div></div>
        <p class="hint" id="cavityHint"></p>
      </div>
      <aside style="display:grid;gap:14px">
        <div class="panel">
          <h3>属性合计</h3>
          <div class="totals" id="totals"><span class="hint">尚未放入器官</span></div>
        </div>
        <div class="panel">
          <h3>特殊效果</h3>
          <div class="fx" id="special"><span class="hint">尚未放入器官</span></div>
        </div>
        <div class="panel">
          <h3>羁绊效果</h3>
          <div class="fx" id="bondfx"><span class="hint">尚未触发羁绊</span></div>
        </div>
        <div class="panel">
          <h3>分享码</h3>
          <div class="row" style="margin-bottom:8px">
            <button class="btn primary" id="exportBtn">导出</button>
            <button class="btn" id="importBtn">导入</button>
          </div>
          <textarea id="share" rows="3" placeholder="分享码会显示在这里，或粘贴分享码后点导入"></textarea>
        </div>
      </aside>
    </div>
  </section>

  <!-- 羁绊 -->
  <section class="view" id="view-bonds">
    <div class="resultbar"><span id="bondCount">—</span><span>·</span><span class="muted">按器官标签件数生效的组合效果</span></div>
    <div class="bonds" id="bonds"></div>
  </section>

</main>

<div class="detail" id="detail"></div>
<div class="picker" id="picker"><div class="box">
  <div class="row" style="justify-content:space-between">
    <input type="search" id="pickQ" placeholder="搜索器官…">
    <button class="btn" id="pickClear">移除</button>
  </div>
  <div class="list" id="pickList"></div>
</div></div>

<script src="./app.js?v=16"></script>
</body>
</html>
