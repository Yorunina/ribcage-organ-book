<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RibCage Organ Book</title>
<meta name="description" content="No Flesh Within Chest 2 · RibCage Organ Book">
<link rel="preload" as="image" href="./mc/gui/kubejs_player_17.png?v=30">
<link rel="stylesheet" href="./style.css?v=30">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text"><b>RibCage Organ Book</b><span>No Flesh Within Chest 2</span></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="codex" aria-selected="true">图鉴</button>
    <button class="tab" role="tab" data-view="builder" aria-selected="false">构筑</button>
    <button class="tab" role="tab" data-view="bonds" aria-selected="false">羁绊</button>
  </nav>
</header>

<main class="wrap">
  <section class="view active" id="view-codex">
    <div class="codex">
      <aside class="filters" id="filters">
        <div class="filter-head">
          <h2>筛选</h2>
          <button class="linkbtn" id="resetFilters">重置</button>
        </div>
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input type="search" id="q" placeholder="名称 / ID / 效果" autocomplete="off">
        </label>
        <div class="filter-group">
          <h3>分类</h3>
          <div class="chips" id="groups"></div>
        </div>
        <div class="filter-group">
          <h3>稀有度</h3>
          <div class="chips" id="ranks"></div>
        </div>
        <div class="filter-group">
          <h3>触发事件</h3>
          <select id="eventFilter"><option value="">全部事件</option></select>
        </div>
        <div class="filter-group">
          <h3>属性</h3>
          <select id="scoreFilter"><option value="">全部属性</option></select>
        </div>
        <p class="filters-note">数据由整合包脚本与语言文件生成。</p>
      </aside>

      <div class="results">
        <div class="resultbar">
          <div class="result-count"><strong id="count">—</strong><span class="muted">个器官</span></div>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <aside class="detail" id="detail" aria-live="polite">
        <div class="detail-empty" id="detailEmpty">
          <span class="empty-mark" aria-hidden="true"></span>
          <p>点选一个器官<br>查看属性、特殊效果与获取方式</p>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </div>
  </section>

  <section class="view" id="view-builder">
    <div class="builder-workbench">
      <aside class="panel organ-library" id="organLibrary">
        <div class="library-head">
          <div><span class="eyebrow">ORGAN LIBRARY</span><h2>器官库</h2></div>
          <span class="library-count" id="libraryCount">—</span>
        </div>
        <label class="search library-search"><span class="search-icon" aria-hidden="true"></span><input type="search" id="libraryQ" placeholder="搜索名称 / ID" autocomplete="off"></label>
        <div class="library-filters"><select id="libraryGroup"><option value="">全部分类</option></select><select id="libraryRank"><option value="">Rank 排序</option><option value="desc">高 → 低</option><option value="asc">低 → 高</option></select></div>
        <div class="library-list" id="libraryList"></div>
      </aside>
      <section class="panel builder-main">
        <div class="builder-head">
          <div><span class="eyebrow">BUILD WORKSPACE</span><h2>胸腔构筑</h2></div>
          <label class="field compact"><span>槽位布局</span><select id="cavitySelect"></select></label>
          <div class="row"><button class="btn" id="fillDefault">填入默认器官</button><button class="btn ghost" id="clearBuild">清空</button></div>
        </div>
        <div class="builder-tip"><span class="tip-key">拖拽</span>器官入槽 · 槽位互换 · 拖出移除 <span class="tip-sep">/</span> <span class="tip-key">右键</span>卸下器官</div>
        <div class="cavity"><div class="slotgrid" id="slotgrid"></div><div class="remove-zone" id="removeZone"><b>移除器官</b><span>拖到这里松手</span></div></div>
        <p class="hint" id="cavityHint"></p>
      </section>
      <aside class="builder-side">
        <div class="panel result-panel"><div class="panel-label">BUILD READOUT</div><h3>属性合计</h3><div class="totals" id="totals"><span class="hint">尚未放入器官</span></div></div>
        <div class="panel result-panel"><h3>特殊效果 <span class="panel-note">实时</span></h3><div class="fx" id="special"><span class="hint">尚未放入器官</span></div></div>
        <div class="panel result-panel"><h3>羁绊效果</h3><div class="fx" id="bondfx"><span class="hint">尚未触发羁绊</span></div></div>
        <div class="panel result-panel share-panel"><h3>分享码</h3><div class="row share-actions"><button class="btn primary" id="exportBtn">导出</button><button class="btn" id="importBtn">导入</button></div><textarea id="share" rows="3" placeholder="导出后复制，或粘贴分享码导入"></textarea></div>
      </aside>
    </div>
  </section>

  <section class="view" id="view-bonds">
    <div class="section-head">
      <h2>器官羁绊</h2>
      <p class="muted" id="bondCount">—</p>
    </div>
    <div class="bonds" id="bonds"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<div class="picker" id="picker"><div class="box">
  <div class="row" style="justify-content:space-between">
    <input type="search" id="pickQ" placeholder="搜索器官…">
    <button class="btn ghost" id="pickClear">移除</button>
  </div>
  <div class="list" id="pickList"></div>
</div></div>

<script src="./app.js?v=30"></script>
</body>
</html>
